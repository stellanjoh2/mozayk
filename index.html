<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mozayk</title>
    <meta
      name="description"
      content="Browser-based mosaic generator for abstract grid compositions, animation, and image-driven layouts."
    />
    <link rel="canonical" href="https://mozayk.design/" />
    <meta property="og:title" content="mozayk" />
    <meta
      property="og:description"
      content="Browser-based mosaic generator for abstract grid compositions, animation, and image-driven layouts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mozayk.design/" />
    <meta
      property="og:image"
      content="https://mozayk.design/share-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="mozayk mosaic generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://mozayk.design/share-image.jpg"
    />
    <script>
      try {
        var t = localStorage.getItem("mozayk-chrome-theme");
        var c = localStorage.getItem("mozayk-chrome-color");
        if (t === "pink" || t === "purple") {
          if (!c) c = "purple";
          t = "dark";
        }
        if (t !== "dark" && t !== "light") {
          t = localStorage.getItem("mozayk-light-theme") === "1" ? "light" : "dark";
        }
        if (c !== "orange" && c !== "purple" && c !== "orby") c = "orange";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.setAttribute("data-chrome", c);
      } catch (e) {}
    </script>
    <!-- Inline so first paint is black before React/CSS modules load. -->
    <style>
      html,
      body {
        background: #000;
      }
      #entry-veil {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #000;
        pointer-events: none;
        animation: entry-veil-fade 1s ease-out forwards;
      }
      @keyframes entry-veil-fade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #entry-veil {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="entry-veil" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      (function () {
        var veil = document.getElementById("entry-veil");
        if (!veil) return;
        var remove = function () {
          veil.remove();
        };
        if (
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          remove();
          return;
        }
        veil.addEventListener("animationend", remove, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

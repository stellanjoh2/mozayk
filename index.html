<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mozayk</title>
    <script>
      try {
        var t = localStorage.getItem("mozayk-chrome-theme");
        var c = localStorage.getItem("mozayk-chrome-color");
        if (t === "pink" || t === "purple") {
          if (!c) c = "purple";
          t = "dark";
        }
        if (t !== "dark" && t !== "light") {
          t = localStorage.getItem("mozayk-light-theme") === "1" ? "light" : "dark";
        }
        if (c !== "orange" && c !== "purple") c = "orange";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.setAttribute("data-chrome", c);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

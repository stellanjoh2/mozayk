<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>mozayk</title>
    <meta
      name="description"
      content="Browser-based mosaic generator for abstract grid compositions, animation, and image-driven layouts."
    />
    <link rel="canonical" href="https://mozayk.design/" />
    <meta property="og:title" content="mozayk" />
    <meta
      property="og:description"
      content="Browser-based mosaic generator for abstract grid compositions, animation, and image-driven layouts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mozayk.design/" />
    <meta
      property="og:image"
      content="https://mozayk.design/share-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="mozayk mosaic generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://mozayk.design/share-image.jpg"
    />
    <script>
      try {
        var t = localStorage.getItem("mozayk-chrome-theme");
        var c = localStorage.getItem("mozayk-chrome-color");
        if (t === "pink" || t === "purple") {
          if (!c) c = "purple";
          t = "dark";
        }
        if (t !== "dark" && t !== "light") {
          t = localStorage.getItem("mozayk-light-theme") === "1" ? "light" : "dark";
        }
        if (c !== "orange" && c !== "purple" && c !== "orby") c = "orange";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.setAttribute("data-chrome", c);
      } catch (e) {}
    </script>
    <!-- Inline so first paint is black, logo tokens exist before CSS modules,
         and the veil can size the mark. Keep fills in sync with brand.css. -->
    <style>
      html,
      body {
        background: #000;
      }
      :root {
        --brand-blue: #2e1ebc;
        --brand-purple: #cf41f2;
        --brand-orange: #ff5300;
        --orby-lime: #c4ff00;
        --orby-purple: #3b00ff;
        --orby-pink: #ff00c4;
        --logo-fill-1: var(--brand-blue);
        --logo-fill-2: var(--brand-purple);
        --logo-fill-3: var(--brand-orange);
        --logo-fill-4: #ffffff;
      }
      html[data-chrome="orby"] {
        --logo-fill-1: var(--orby-purple);
        --logo-fill-2: var(--orby-pink);
        --logo-fill-3: var(--orby-lime);
      }
      #entry-veil {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        pointer-events: auto;
        cursor: default;
        user-select: none;
      }
      #entry-veil .entry-intro {
        box-sizing: border-box;
        width: 66vw;
        flex-shrink: 0;
        aspect-ratio: 292.5 / 45;
        --logo-fill-4: #ffffff;
      }
      #entry-veil .entry-intro svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #entry-veil.is-lifting {
        will-change: opacity;
        animation: entry-veil-fade 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes entry-veil-fade {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="entry-veil" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
